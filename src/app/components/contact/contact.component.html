<section id="contact" class="section anchor">
  <div class="container">
    <div class="card block">
      <h2 class="h2">{{ lang.t('contact_title') }}</h2>

      <div class="wrap">
        <div class="avatar">TB</div>

        <div class="info card">
          <div class="row">
            <i class="ico devicon-google-plain colored"></i>
            <a [href]="'mailto:' + email">{{ email }}</a>
            <button class="btn" (click)="copyEmail()">{{ lang.t('btn_copy') }}</button>
          </div>

          <div class="row">
            <i class="ico devicon-linkedin-plain colored"></i>
            <a href="https://www.linkedin.com/in/tom%C3%A1s-breppe-/?trk=opento_sprofile_details" target="_blank" rel="noopener">
              LinkedIn
            </a>
          </div>

          <div class="row">
            <i class="ico devicon-github-original"></i>
            <a href="https://github.com/TomasBreppe" target="_blank" rel="noopener">GitHub</a>
          </div>

          <div class="actions">
            <a class="btn primary" href="/assets/cv/Breppe Ronzini Tomás Ezequiel.pdf" target="_blank" rel="noopener">
                CV Español
            </a>

            <a class="btn primary" href="/assets/cv/Breppe Ronzini Tomás Ezequiel EN.pdf" target="_blank" rel="noopener">
               English Resume
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
